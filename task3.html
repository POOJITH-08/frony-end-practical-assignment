<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task 3 - Music Player &amp; Playlist Shelf</title>
<style>
  /* 1. Box model reset */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    background-color: #0b1020;
    color: #e2e8f0;
    padding: 2rem 1rem;
    display: flex;
    justify-content: center;
  }

  .component-container { width: 100%; max-width: 900px; }

  /* ---------- Mobile base: single column stack ---------- */
  .player {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1.5rem;
    background: #151b33;
    border: 1px solid #263055;
    border-radius: 20px;
    padding: 1.5rem;
  }

  /* ---------- Album section ---------- */
  .album { display: flex; flex-direction: column; align-items: center; text-align: center; }

  .vinyl {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    /* grooves + shine + label */
    background:
      radial-gradient(circle at center, #f43f5e 0 18%, #111 19% 22%, transparent 23%),
      repeating-radial-gradient(circle at center, #1c1c24 0 3px, #101015 3px 6px);
    box-shadow: 0 0 0 4px #0b0f1f, 0 10px 30px rgba(0, 0, 0, 0.6);
    position: relative;
    animation: spin 6s linear infinite;
    animation-play-state: paused;       /* starts paused; PLAY button runs it */
  }
  /* off-centre highlight so the rotation is visible */
  .vinyl::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0 20%, rgba(255,255,255,.12) 25%, transparent 30% 70%, rgba(255,255,255,.1) 75%, transparent 80%);
  }
  .vinyl.playing { animation-play-state: running; }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .album h1 { font-size: 1.25rem; margin-top: 1rem; }
  .album p  { color: #94a3b8; font-size: 0.9rem; }

  /* Playback controls: Flexbox with uniform gap */
  .controls {
    display: flex;
    justify-content: center;
    gap: 0.75rem;
    margin-top: 1rem;
  }
  .controls button {
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: 50%;
    background: #263055;
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .controls button:active { transform: scale(0.92); }
  .controls .play { background: #f43f5e; }

  /* ---------- Queue ---------- */
  .queue h2 { font-size: 1rem; color: #94a3b8; margin-bottom: 0.75rem; font-weight: 600; }
  .tracklist { list-style: none; display: grid; gap: 0.5rem; }

  .track {
    display: flex;
    justify-content: space-between;   /* title left, duration right */
    align-items: center;
    width: 100%;
    background: #1c2445;
    border-radius: 10px;
    padding: 0.85rem 1rem;
    transition: transform 0.2s ease;
    cursor: pointer;
  }
  .track:hover { transform: translateX(6px); }
  .track .time { color: #94a3b8; font-variant-numeric: tabular-nums; }
  .track.current .name { color: #fb7185; font-weight: 700; }

  /* ---------- Desktop breakpoint ---------- */
  @media (min-width: 768px) {
    .player {
      grid-template-columns: 200px 1fr;   /* fixed album column + fluid queue */
      align-items: start;
      gap: 2rem;
    }
    .vinyl { width: 200px; height: 200px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .vinyl { animation-duration: 30s; }
    .track { transition: none; }
  }
</style>
</head>
<body>
<main class="component-container">
  <section class="player">

    <div class="album">
      <div class="vinyl" id="vinyl" aria-hidden="true"></div>
      <h1>Midnight Echoes</h1>
      <p>Cyber Wave &bull; 2026</p>
      <div class="controls">
        <button type="button" aria-label="Previous">&#9198;</button>
        <button type="button" class="play" id="play" aria-label="Play">&#9654;</button>
        <button type="button" aria-label="Next">&#9197;</button>
      </div>
    </div>

    <div class="queue">
      <h2>Up Next</h2>
      <ul class="tracklist">
        <li class="track current"><span class="name">01. Neon Route</span><span class="time">3:42</span></li>
        <li class="track"><span class="name">02. Silicon Drift</span><span class="time">4:15</span></li>
        <li class="track"><span class="name">03. Digital Rain</span><span class="time">2:58</span></li>
        <li class="track"><span class="name">04. Night Ride</span><span class="time">3:10</span></li>
      </ul>
    </div>

  </section>
</main>

<script>
  // Play / pause toggles the vinyl spin
  const vinyl = document.getElementById('vinyl');
  const play = document.getElementById('play');
  play.addEventListener('click', () => {
    const on = vinyl.classList.toggle('playing');
    play.innerHTML = on ? '&#10074;&#10074;' : '&#9654;';
    play.setAttribute('aria-label', on ? 'Pause' : 'Play');
  });
</script>
</body>
</html>
